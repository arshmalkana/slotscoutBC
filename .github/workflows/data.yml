name: Data checks

# Release gate (main spec 10, 11; Addendum A 10.5). The regression set runs against live official
# data, so it is scheduled rather than run on every push. The monthly pipeline itself runs in the
# ingest container (docker compose run --rm ingest make monthly) where its output can be committed.
on:
  schedule:
    - cron: "17 13 * * *" # daily, 06:17 Pacific (daylight time)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Regression set (zero false greens)
        run: npm run regression

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the site and ingest images
        run: docker compose --profile pipeline build
      - name: Pipeline runs in the ingest container
        run: docker compose --profile pipeline run --rm ingest make validate
